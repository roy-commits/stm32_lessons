# 选择ST-Link通用接口（若为ST-Link V2，也可改为 stlink-v2.cfg，兼容性更稳）
source [find interface/stlink.cfg]

# 强制指定SWD传输协议（关键！解决自动选择兼容问题）
transport select swd

# 配置目标芯片（STM32F1系列）
source [find target/stm32f1x.cfg]

# 明确Flash大小（STM32F103C8T6为64KB = 0x10000）
set FLASH_SIZE 0x10000

# 降低通信速度（500kHz可尝试，若仍失败改为100kHz，稳定性更高）
adapter speed 100